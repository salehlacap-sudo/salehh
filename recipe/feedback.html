    <h1>Feedback</h1>

    <p>Have feedback for us? Share your thoughts, suggestions, or any problems you encountered on our website. We appreciate your feedback and use it to make Odin Recipes even better!.</p>

    <!-- Feedback Form -->
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" size="30"required><br><br>

        <label for="email">Email:</label><br>
        <input type="text" id="email" size="30" required><br><br>

        <strong>Rating:</strong><br><br>

        <div>
            <label>1</label>
            <input type="radio" name="rating" value="1" required>
            <label>2</label>
            <input type="radio" name="rating" value="2">
            <label>3</label>
            <input type="radio" name="rating" value="3">
            <label>4</label>
            <input type="radio" name="rating" value="4">
            <label>5</label>
            <input type="radio" name="rating" value="5">
        </div>

        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="4" cols="50" required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

    <img src="../image/ok.jpg" width="200px">

    </body>
